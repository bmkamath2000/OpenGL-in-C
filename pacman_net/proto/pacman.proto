syntax = "proto3";

package pacman;

// ── Published by server, consumed by Qt client ────────────────────────────────

message GhostState {
    double x         = 1;
    double y         = 2;
    double angle     = 3;
    bool   edible    = 4;
    bool   eaten     = 5;
    float  color_r   = 6;
    float  color_g   = 7;
    float  color_b   = 8;
    int32  edible_timer = 9;
}

message GameState {
    double pac_x      = 1;
    double pac_y      = 2;
    double pac_angle  = 3;
    bool   animate    = 4;
    int32  lives      = 5;
    int32  points     = 6;
    bool   gameover   = 7;
    bool   start_wait = 8;
    int32  pebbles_left = 9;

    repeated GhostState ghosts = 10;

    // Flat row-major 31x28 pebble array (0=empty, 1=normal, 3=super)
    repeated int32 pebble_array = 11;
}

// ── Published by Qt client, consumed by server ────────────────────────────────

enum KeyAction {
    KEY_NONE  = 0;
    KEY_UP    = 1;
    KEY_DOWN  = 2;
    KEY_LEFT  = 3;
    KEY_RIGHT = 4;
}

message KeyInput {
    KeyAction action  = 1;
    bool      pressed = 2;  // true = key down, false = key up
}
